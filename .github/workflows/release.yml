name: Release

# Pushing a tag like v0.1.0 runs every CI check, then publishes that version to npm with
# provenance, so users can verify the package was built here from that commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # For npm trusted publishing and both provenance attestations.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: The tag matches package.json's version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - run: pnpm build
      - run: node scripts/check-package.ts

      # npm, not pnpm: npm does trusted publishing (OIDC) itself. With an NPM_TOKEN secret set
      # instead, setup-node's .npmrc uses it.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The same package for install.sh's GitHub source, for those who can't install from npm.
      # One name for every version, so releases/latest/download/megareviewer.tgz is the latest.
      - run: npm pack && mv "megareviewer-${GITHUB_REF_NAME#v}.tgz" megareviewer.tgz

      - uses: actions/attest@v4
        with:
          subject-path: megareviewer.tgz

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: megareviewer.tgz
          retention-days: 1

  # Apart from publish, so the job that can write to the repository runs no installed code.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package

      - run: |
          gh release create "$GITHUB_REF_NAME" megareviewer.tgz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "megareviewer ${GITHUB_REF_NAME#v}" \
            --notes "Also on npm. To install from this release instead: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | MEGAREVIEWER_SOURCE=github MEGAREVIEWER_VERSION=${GITHUB_REF_NAME#v} sh\`"
        env:
          GH_TOKEN: ${{ github.token }}
